<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Survivor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; }

        /* HUD */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%;
            padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
            pointer-events: none; z-index: 10;
        }
        .hud-text {
            font-size: 16px; font-weight: bold; letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
            background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 6px;
            border: 1px solid rgba(0, 240, 255, 0.3);
        }
        #hud-bottom {
            position: absolute; bottom: 12px; left: 0; width: 100%;
            display: flex; justify-content: space-between; padding: 0 20px;
            pointer-events: none; z-index: 10;
        }
        #stage-bar-container {
            position: absolute; top: 58px; left: 50%; transform: translateX(-50%);
            width: 320px; height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 4px; overflow: hidden;
            pointer-events: none; z-index: 10;
        }
        #stage-bar { width: 0%; height: 100%; transition: width 0.3s ease; }

        /* Panels */
        .panel {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 8, 22, 0.88); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100;
        }
        .panel h1 { font-size: 52px; margin-bottom: 15px; color: #00f0ff; text-shadow: 0 0 20px #00f0ff;
        letter-spacing: 4px; }
        .panel h2 {font-size: 36px; margin-bottom: 20px; color: #fff; text-shadow: 0 0 12px rgba(255,255,255,0.5); }
        .panel h3 { font-size: 22px; margin-bottom: 10px; color: #aaa; }
        .panel p { font-size: 18px; margin-bottom: 8px; color: #ccc; }
        .panel button {
            background: transparent; color: #00f0ff; border: 2px solid #00f0ff;
            padding: 12px 40px; font-size: 18px; font-weight: bold; margin: 8px;
            cursor: pointer; border-radius: 6px; transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); letter-spacing: 2px;
        }
        .panel button:hover {
            background: #00f0ff; color: #000;
            box-shadow: 0 0 25px #00f0ff; transform: translateY(-2px);
        }
        .setting-row {
            display: flex; align-items: center; justify-content: space-between;
            width: 340px; margin: 10px 0; font-size: 18px; font-weight: bold;
        }
        .setting-row button { padding: 6px 18px; margin: 0; min-width: 80px; }
        .setting-row input[type=range] { width: 140px; cursor: pointer; }

        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: flex; justify-content: center; align-items: center; z-index: 200;
        }
        .modal-box {
            background: #0d1326; border: 2px solid #ff0055;
            padding: 35px; border-radius: 10px; text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.4);
        }
        .modal-box p { font-size: 22px; margin-bottom: 25px; font-weight: bold; color: #fff; }

        .controls-info {
            margin-top: 20px; font-size: 14px; color: #888;
            text-align: center; line-height: 1.8;
        }
        .controls-info span { color: #00f0ff; font-weight: bold; }
        </style>
